<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../ds-dev-loader.js"></script></head>
<body style="margin:0;padding:24px;background:var(--surface-page)"><div id="root"></div>
<script type="text/babel">
window.loadDS('../../').then(NS => {
const { Breadcrumbs, Tabs } = NS;
const Lbl = ({ children }) => <div style={{ fontFamily: 'var(--font-mono)', fontSize: 14, color: 'var(--noir-2)', margin: '18px 0 8px' }}>{children}</div>;
function Demo() {
  return <div>
    <Lbl>Breadcrumbs</Lbl>
    <Breadcrumbs items={[{ label: 'Accueil', href: '#' }, { label: 'Grenoupedia', href: '#' }, { label: 'Recettes', href: '#' }, { label: 'Cuisine & techniques' }]} />
    <Lbl>Tabs</Lbl>
    <Tabs items={[{ id: 'ig', label: 'Carrousel Instagram', meta: '4:5' }, { id: 'reel', label: 'Reel / TikTok', meta: '9:16 · 30 s' }, { id: 'li', label: 'LinkedIn B2B', meta: '1:1' }]} />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script></body></html>
