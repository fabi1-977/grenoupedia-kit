<!-- @dsCard group="Grenoupedia recette" viewport="1280x900" name="Fiche recette + formats sociaux" -->
<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../ds-dev-loader.js"></script>
<script src="./data.js"></script></head>
<body><div id="root"></div>
<script type="text/babel" src="./RecipePage.jsx"></script>
<script type="text/babel" src="./SocialFormats.jsx"></script>
<script type="text/babel">
function App() {
  const { Tabs } = window.GNS;
  const [screen, setScreen] = React.useState('recette');
  const S = window.SocialFormats;
  return <div>
    <div style={{ background: 'var(--vert)', padding: '0 clamp(20px, 4vw, 48px)' }}>
      <div style={{ maxWidth: 'var(--container-max)', margin: '0 auto' }}>
        <Tabs tone="fonce" value={screen} onChange={setScreen} items={[{ id: 'recette', label: 'Fiche recette', meta: 'web' }, { id: 'ig', label: 'Carrousel Instagram', meta: '4:5' }, { id: 'reel', label: 'Reel / TikTok', meta: '9:16 · 30 s' }, { id: 'li', label: 'LinkedIn B2B', meta: '1:1' }]} />
      </div>
    </div>
    {screen === 'recette' ? <window.RecipePage R={window.RECETTE} /> :
      <div style={{ maxWidth: 'var(--container-max)', margin: '0 auto', padding: '48px clamp(20px, 4vw, 48px)' }}>
        {screen === 'ig' && <S.Instagram />}{screen === 'reel' && <S.Reel />}{screen === 'li' && <S.LinkedIn />}
      </div>}
  </div>;
}
window.loadDS('../../').then(NS => { window.GNS = NS; ReactDOM.createRoot(document.getElementById('root')).render(<App />); });
</script></body></html>
