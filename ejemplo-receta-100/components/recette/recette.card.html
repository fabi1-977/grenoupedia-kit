<!-- @dsCard group="Components" viewport="700x900" name="Recette" -->
<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../ds-dev-loader.js"></script></head>
<body style="margin:0;padding:24px;background:var(--surface-page)"><div id="root"></div>
<script type="text/babel">
window.loadDS('../../').then(NS => {
const { CutBadge, CutSelector, CalibreRule, FicheTechnique, MetaBar, ErrorCallout, PairingCard } = NS;
const Lbl = ({ children }) => <div style={{ fontFamily: 'var(--font-mono)', fontSize: 14, color: 'var(--noir-2)', margin: '18px 0 8px' }}>{children}</div>;
function Demo() {
  return <div>
    <Lbl>CutBadge — md · sm</Lbl>
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 24, alignItems: 'flex-start' }}><CutBadge cut="premium" showDesc /><CutBadge cut="g1" showDesc /><CutBadge cut="perle" size="sm" /><CutBadge cut="lollifrog" size="sm" /></div>
    <Lbl>CutSelector</Lbl><CutSelector defaultValue="premium" />
    <Lbl>CalibreRule</Lbl><CalibreRule active="8/12" />
    <Lbl>MetaBar</Lbl>
    <MetaBar items={[{ label: 'Préparation', value: '15 min' }, { label: 'Cuisson', value: '2 min 30 s', alert: '90 s max. par face' }, { label: 'Portions', value: '4' }]} />
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, marginTop: 20 }}>
      <FicheTechnique cut="g1" calibre="8/12" sku="GRN-CPS-G1-0812" rows={[{ label: 'Glaçage', value: '15 % déclaré' }, { label: 'Égoutté', value: '850 g/kg' }]} />
      <PairingCard vin={{ name: 'Chablis ou Meursault', note: 'Blanc sec de Bourgogne, tendu.' }} sansAlcool={{ name: 'Infusion à froid de thé blanc', note: 'Citron, bergamote.' }} />
    </div>
    <div style={{ marginTop: 20 }}><ErrorCallout title="Elle ne se braise pas : elle se saisit." rule="Règle : jamais plus de 90 s par face.">Fibre fine et courte : rien à attendrir. Au-delà de deux minutes, la chair se contracte et sèche.</ErrorCallout></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script></body></html>
